services:
  cscircles:
    privileged: true
    build: .
    depends_on:
      - mysql
    volumes:
      # Content of wordpress will go here
      - ./data/html:/var/www/html
      # optional lesson exports (*.xml) for cscircles-setup
      - ./import:/import:ro
    ports:
      - 8888:80
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_PASSWORD: example
      CSCIRCLES_URL: http://localhost:8888
      CSCIRCLES_ADMIN_USER: admin
      CSCIRCLES_ADMIN_PASSWORD: example
      CSCIRCLES_ADMIN_EMAIL: admin@example.com

  mysql:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
